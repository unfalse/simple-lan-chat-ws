<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>LAN Chat</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

      background: #181818;
      color: #fff;

      font-family: Arial, sans-serif;
    }

    .chat {
      height: 100vh;
      max-width: 700px;

      margin: 0 auto;

      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 20px;

      border-bottom:
        1px solid #333;

      font-size: 20px;
      font-weight: bold;
    }

    #status {
      font-size: 13px;
      color: #888;

      margin-top: 5px;
    }

    #messages {
      flex: 1;

      overflow-y: auto;

      padding: 20px;
    }

    .message {
      margin-bottom: 10px;
    }

    .name {
      color: #61dafb;
      font-weight: bold;
    }

    form {
      display: flex;
      gap: 8px;

      padding: 12px;

      border-top:
        1px solid #333;
    }

    input {
      border: 1px solid #444;
      border-radius: 6px;

      background: #222;
      color: white;

      padding: 11px;
    }

    #name {
      width: 120px;
    }

    #text {
      flex: 1;
    }

    button {
      border: 0;
      border-radius: 6px;

      padding: 0 20px;

      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="chat">

    <header>
      💬 LAN Chat

      <div id="status">
        Connecting...
      </div>
    </header>

    <div id="messages"></div>

    <form id="form">

      <input id="name" value="User" placeholder="Имя">

      <input id="text" placeholder="Сообщение..." autocomplete="off">

      <button>
        Send
      </button>

    </form>

  </div>

  <script>
    const messages =
      document.querySelector('#messages');

    const status =
      document.querySelector('#status');

    const form =
      document.querySelector('#form');

    const nameInput =
      document.querySelector('#name');

    const textInput =
      document.querySelector('#text');

    const protocol =
      location.protocol === 'https:'
        ? 'wss:'
        : 'ws:';

    const socket =
      new WebSocket(
        `${protocol}//${location.host}/browser`
      );

    socket.addEventListener(
      'open',
      () => {
        status.textContent =
          'Connected';
      }
    );

    socket.addEventListener(
      'close',
      () => {
        status.textContent =
          'Disconnected';
      }
    );

    socket.addEventListener(
      'message',
      (event) => {
        const data =
          JSON.parse(event.data);

        if (
          data.type === 'CHAT_MESSAGE'
        ) {
          addMessage(
            data.name,
            data.text
          );
        }
      }
    );

    form.addEventListener(
      'submit',
      (event) => {
        event.preventDefault();

        const name =
          nameInput.value.trim();

        const text =
          textInput.value.trim();

        if (!name || !text) {
          return;
        }

        socket.send(
          JSON.stringify({
            type:
              'CHAT_MESSAGE',

            name,
            text,
          })
        );

        textInput.value = '';

        textInput.focus();
      }
    );

    function addMessage(
      name,
      text
    ) {
      const element =
        document.createElement('div');

      element.className =
        'message';

      const nameElement =
        document.createElement('span');

      nameElement.className =
        'name';

      nameElement.textContent =
        `${name}: `;

      const textElement =
        document.createElement('span');

      textElement.textContent =
        text;

      element.append(
        nameElement,
        textElement
      );

      messages.appendChild(
        element
      );

      messages.scrollTop =
        messages.scrollHeight;
    }
  </script>

</body>

</html>
