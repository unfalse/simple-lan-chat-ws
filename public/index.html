<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>LAN Chat</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;

        background: #181818;
        color: #fff;

        font-family: Arial, sans-serif;
      }

      .chat {
        height: 100vh;
        max-width: 700px;

        margin: 0 auto;

        display: flex;
        flex-direction: column;
      }

      header {
        padding: 16px 20px;

        border-bottom: 1px solid #333;

        font-size: 20px;
        font-weight: bold;
      }

      #status {
        font-size: 13px;
        color: #888;

        margin-top: 5px;
      }

      #messages {
        flex: 1;

        overflow-y: auto;

        padding: 20px;
      }

      .message {
        margin-bottom: 10px;
      }

      .name {
        color: #61dafb;
        font-weight: bold;
      }

      .progress-label {
        font-size: 13px;
        color: #ccc;

        margin-bottom: 4px;
      }

      .progress-track {
        width: 220px;
        height: 6px;

        background: #333;
        border-radius: 3px;

        overflow: hidden;
      }

      .progress-fill {
        width: 0%;
        height: 100%;

        background: #61dafb;

        transition: width 0.1s linear;
      }

      form {
        display: flex;
        gap: 8px;

        padding: 12px;

        border-top: 1px solid #333;
      }

      input {
        border: 1px solid #444;
        border-radius: 6px;

        background: #222;
        color: white;

        padding: 11px;
      }

      #name {
        width: 120px;
      }

      #text {
        flex: 1;
      }

      button {
        border: 0;
        border-radius: 6px;

        padding: 0 20px;

        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <div class="chat">
      <header>
        💬 LAN Chat

        <div id="status">Connecting...</div>
      </header>

      <div id="messages"></div>

      <form id="form">
        <form id="form">
          <input id="name" value="User" placeholder="Имя" />

          <input id="text" placeholder="Сообщение..." autocomplete="off" />

          <input id="file" type="file" />

          <button>Send</button>
        </form>
      </form>
    </div>

    <script>
      const messages = document.querySelector('#messages');

      const status = document.querySelector('#status');

      const form = document.querySelector('#form');

      const nameInput = document.querySelector('#name');

      const textInput = document.querySelector('#text');

      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';

      const socket = new WebSocket(`${protocol}//${location.host}/browser`);

      /*
       * Без этого event.data для бинарных
       * сообщений — Blob, и его пришлось бы
       * конвертировать асинхронно, что может
       * привести к обработке FILE_END раньше,
       * чем последний chunk.
       */
      socket.binaryType = 'arraybuffer';

      const CHUNK_SIZE = 64 * 1024;

      const incomingFiles = new Map();

      /*
       * fileId -> элементы прогресс-бара
       * файлов, которые отправляем сами.
       */
      const sendingFiles = new Map();

      socket.addEventListener('open', () => {
        status.textContent = 'Connected';
      });

      socket.addEventListener('close', () => {
        status.textContent = 'Disconnected';
      });

      const fileInput = document.querySelector('#file');

      socket.addEventListener('message', (event) => {
        /*
         * JSON
         */
        if (typeof event.data === 'string') {
          const data = JSON.parse(event.data);

          if (data.type === 'CHAT_MESSAGE') {
            addMessage(data.name, data.text);
          }

          if (data.type === 'FILE_START') {
            incomingFiles.set(data.fileId, {
              ...data,
              chunks: new Array(data.totalChunks),
              receivedChunks: 0,
            });

            console.log(`Receiving ${data.fileName}`);
          }

          if (data.type === 'FILE_END') {
            finishFile(data.fileId);
          }

          return;
        }

        /*
         * Binary chunk
         */
        if (event.data instanceof ArrayBuffer) {
          handleFileChunk(event.data);
        }
      });

      function handleFileChunk(buffer) {
        const bytes = new Uint8Array(buffer);

        /*
         * Первые 16 байт — UUID.
         */
        const fileId = bytesToUuid(bytes.slice(0, 16));

        /*
         * Следующие 4 байта —
         * номер chunk.
         */
        const view = new DataView(buffer);
        const chunkIndex = view.getUint32(16);

        /*
         * Остальное — данные файла.
         */
        const chunk = bytes.slice(20);
        const file = incomingFiles.get(fileId);
        if (!file) {
          console.error('Unknown file:', fileId);
          return;
        }

        file.chunks[chunkIndex] = chunk;
        file.receivedChunks++;

        const progress = Math.round((file.receivedChunks / file.totalChunks) * 100);
        console.log(`Downloading ${file.fileName}: ${progress}%`);
      }

      function finishFile(fileId) {
        const file = incomingFiles.get(fileId);

        if (!file) {
          return;
        }

        if (file.receivedChunks !== file.totalChunks) {
          console.error('File incomplete:', file.fileName);
          return;
        }

        const blob = new Blob(file.chunks, { type: file.mimeType });

        const sending = sendingFiles.get(fileId);

        if (sending) {
          finishFileProgress(sending, file.fileName, blob);
          sendingFiles.delete(fileId);
        } else {
          addFileMessage(file.name, file.fileName, blob);
        }

        incomingFiles.delete(fileId);
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();

        const name = nameInput.value.trim();

        const text = textInput.value.trim();

        const file = fileInput.files[0];

        if (!name) {
          return;
        }

        /*
         * Обычное сообщение.
         */
        if (text) {
          socket.send(
            JSON.stringify({
              type: 'CHAT_MESSAGE',
              name,
              text,
            }),
          );

          textInput.value = '';
        }

        /*
         * Файл.
         */
        if (file) {
          await sendFile(file, name);

          fileInput.value = '';
        }

        textInput.focus();
      });

      function uuidToBytes(uuid) {
        return new Uint8Array(
          uuid
            .replaceAll('-', '')
            .match(/.{2}/g)
            .map((byte) => parseInt(byte, 16)),
        );
      }

      function bytesToUuid(bytes) {
        const hex = [...bytes].map((byte) => byte.toString(16).padStart(2, '0')).join('');

        return [
          hex.slice(0, 8),
          hex.slice(8, 12),
          hex.slice(12, 16),
          hex.slice(16, 20),
          hex.slice(20),
        ].join('-');
      }

      function waitForSocketDrain() {
        return new Promise((resolve) => {
          const timer = setInterval(() => {
            if (socket.bufferedAmount <= CHUNK_SIZE) {
              clearInterval(timer);
              resolve();
            }
          }, 10);
        });
      }

      function generateUUID() {
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (char) => {
          const random = (Math.random() * 16) | 0;
          const value = char === 'x' ? random : (random & 0x3) | 0x8;

          return value.toString(16);
        });
      }

      async function sendFile(file, name) {
        const fileId = generateUUID();

        /*
         * UUID переводим в 16 байт.
         */
        const fileIdBytes = uuidToBytes(fileId);

        const totalChunks = Math.ceil(file.size / CHUNK_SIZE);

        const progressElement = addFileProgressMessage(name, file.name, fileId);

        /*
         * FILE_START
         */
        socket.send(
          JSON.stringify({
            type: 'FILE_START',

            fileId,

            name,

            fileName: file.name,

            mimeType: file.type || 'application/octet-stream',

            size: file.size,

            totalChunks,
          }),
        );

        /*
         * Отправляем chunks.
         */
        for (let chunkIndex = 0; chunkIndex < totalChunks; chunkIndex++) {
          const start = chunkIndex * CHUNK_SIZE;

          const end = Math.min(start + CHUNK_SIZE, file.size);

          const chunk = await file.slice(start, end).arrayBuffer();

          const packet = new Uint8Array(20 + chunk.byteLength);

          /*
           * первые 16 байт = UUID
           */
          packet.set(fileIdBytes, 0);

          /*
           * следующие 4 байта = chunkIndex
           */
          const view = new DataView(packet.buffer);

          view.setUint32(16, chunkIndex);

          /*
           * сам файл
           */
          packet.set(new Uint8Array(chunk), 20);

          socket.send(packet);

          /*
           * Небольшая информация
           * о прогрессе.
           */
          const progress = Math.round(((chunkIndex + 1) / totalChunks) * 100);

          console.log(`Uploading ${progress}%`);

          updateFileProgress(progressElement, progress);

          /*
           * Не забиваем WebSocket огромным
           * количеством frames.
           */
          if (socket.bufferedAmount > CHUNK_SIZE * 4) {
            await waitForSocketDrain();
          }
        }

        /*
         * FILE_END
         */
        socket.send(
          JSON.stringify({
            type: 'FILE_END',

            fileId,
          }),
        );
      }

      function addMessage(name, text) {
        const element = document.createElement('div');
        element.className = 'message';

        const nameElement = document.createElement('span');
        nameElement.className = 'name';
        nameElement.textContent = `${name}: `;

        const textElement = document.createElement('span');
        textElement.textContent = text;

        element.append(nameElement, textElement);
        messages.appendChild(element);
        messages.scrollTop = messages.scrollHeight;
      }

      function addFileMessage(sender, fileName, blob) {
        const element = document.createElement('div');
        element.className = 'message';

        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = fileName;
        link.textContent = `📎 ${sender}: ${fileName}`;
        link.style.color = '#61dafb';

        element.appendChild(link);
        messages.appendChild(element);
        messages.scrollTop = messages.scrollHeight;
      }

      function addFileProgressMessage(sender, fileName, fileId) {
        const element = document.createElement('div');
        element.className = 'message';

        const label = document.createElement('div');
        label.className = 'progress-label';
        label.textContent = `📎 ${sender}: ${fileName} — 0%`;

        const track = document.createElement('div');
        track.className = 'progress-track';

        const fill = document.createElement('div');
        fill.className = 'progress-fill';

        track.appendChild(fill);
        element.append(label, track);
        messages.appendChild(element);
        messages.scrollTop = messages.scrollHeight;

        const progressElement = { element, label, fill, sender, fileName };

        sendingFiles.set(fileId, progressElement);

        return progressElement;
      }

      function updateFileProgress(progressElement, percent) {
        progressElement.fill.style.width = `${percent}%`;
        progressElement.label.textContent = `📎 ${progressElement.sender}: ${progressElement.fileName} — ${percent}%`;
      }

      function finishFileProgress(progressElement, fileName, blob) {
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = fileName;
        link.textContent = `📎 ${progressElement.sender}: ${fileName}`;
        link.style.color = '#61dafb';

        progressElement.element.replaceChildren(link);
      }
    </script>
  </body>
</html>
